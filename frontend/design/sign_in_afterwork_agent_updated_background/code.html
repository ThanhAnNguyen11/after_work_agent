<script>
        // Micro-interaction for the login button
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Loading state
            btn.innerHTML = `
                <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                Signing in...
            `;
            btn.disabled = true;

            // Simulating a response
            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined">check_circle</span>
                    Welcome back!
                `;
                btn.classList.replace('bg-rausch', 'bg-tertiary');
                
                setTimeout(() => {
                    // Reset or Redirect
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.replace('bg-tertiary', 'bg-rausch');
                }, 2000);
            }, 1500);
        });

        // Toggle password visibility
        const togglePass = document.querySelector('button .material-symbols-outlined');
        togglePass?.parentElement.addEventListener('click', () => {
            const input = document.getElementById('password');
            if (input.type === 'password') {
                input.type = 'text';
                togglePass.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                togglePass.textContent = 'visibility';
            }
        });
    </script>
