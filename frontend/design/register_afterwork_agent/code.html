<!-- Full Name Field -->

<input class="w-full h-12 px-stack-md border border-hairline rounded-lg font-body-md text-body-md bg-canvas transition-all outline-none input-focus-ring group-hover:border-ink/20" id="fullName" name="fullName" placeholder="annt7" required="" type="text">

<!-- Email Field -->

<div class="mt-1 flex items-center gap-1">

<span class="text-[12px] text-secondary font-medium">Please use your official @vng.com address</span>

</div>

<button class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-secondary hover:text-ink transition-colors flex items-center justify-center" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>
</button>
</div>
</div>

<!-- Scripts -->
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Simple animation on focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('premium-shadow');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('premium-shadow');
            });
        });

        // Form Submission Interception
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Creating...`;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Welcome aboard!`;
                btn.classList.replace('bg-rausch', 'bg-ink');
            }, 1500);
        });
    </script>
